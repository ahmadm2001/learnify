<div style="font-family: Arial, sans-serif; background:#f4f6f8; padding:30px;">
    <div
        style="max-width:600px; margin:auto; background:white; border-radius:12px; padding:30px; box-shadow:0 10px 25px rgba(0,0,0,0.08);">

        <h2 style="color:#4f46e5;">🔐 Login Alert</h2>

        <p>Hi <b>{{ username }}</b>,</p>

        <p>You just logged into your <b>Learnify</b> account.</p>

        <p>If this wasn’t you, please reset your password immediately.</p>

        <a href="{{ reset_link }}"
            style="display:inline-block; margin-top:20px; padding:12px 20px; background:#4f46e5; color:white; border-radius:8px; text-decoration:none; font-weight:600;">
            Reset Password
        </a>

        <hr style="margin:30px 0; border:none; border-top:1px solid #eee;" />

        <p style="font-size:12px; color:#888;">
            © Learnify • Secure learning platform
        </p>

    </div>
</div>
