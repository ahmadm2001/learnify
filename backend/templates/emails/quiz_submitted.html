<!DOCTYPE html>
<html>

<body style="margin:0; padding:0; background:#f4f6fb; font-family:sans-serif;">

    <div
        style="max-width:600px; margin:40px auto; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,0.08);">

        <!-- HEADER -->
        <div style="background:linear-gradient(135deg,#0ea5e9,#2563eb); padding:30px; text-align:center; color:white;">
            <h2 style="margin:0;">📥 Quiz Submitted</h2>
            <p style="font-size:13px; opacity:0.9;">
                A student has completed a quiz
            </p>
        </div>

        <!-- BODY -->
        <div style="padding:30px;">

            <p>Hello <b>{{ teacher_name }}</b>,</p>

            <p>A student has submitted a quiz. Here are the details:</p>

            <!-- INFO CARD -->
            <div style="margin-top:20px; padding:20px; border-radius:12px; background:#f1f5ff;">
                <p><b>👨‍🎓 Student:</b> {{ student_name }}</p>
                <p><b>📚 Course:</b> {{ course_title }}</p>
                <p><b>📝 Quiz:</b> {{ quiz_title }}</p>
            </div>

            <!-- ALERT -->
            <div style="margin-top:25px; padding:15px; background:#fff3cd; border-radius:10px; color:#856404;">
                ⚠️ Please review and grade this submission.
            </div>

        </div>

        <!-- FOOTER -->
        <div style="padding:20px; text-align:center; font-size:12px; color:#888;">
            Learnify Instructor Panel
        </div>

    </div>

</body>

</html>
