<!DOCTYPE html>
<html>

<body style="margin:0; padding:0; background:#f4f6fb; font-family:sans-serif;">

    <div
        style="max-width:600px; margin:40px auto; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,0.08);">

        <!-- HEADER -->
        <div style="background:linear-gradient(135deg,#10b981,#059669); padding:30px; text-align:center; color:white;">
            <h2 style="margin:0;">✅ Quiz Graded</h2>
            <p style="font-size:13px; opacity:0.9;">
                Your results are ready
            </p>
        </div>

        <!-- BODY -->
        <div style="padding:30px;">

            <p>Hello <b>{{ username }}</b>,</p>

            <p>Your quiz has been graded successfully 🎉</p>

            <!-- SCORE CARD -->
            <div style="margin-top:20px; padding:25px; border-radius:12px; background:#ecfdf5; text-align:center;">
                <p style="margin:0; font-size:14px;">📝 {{ quiz_title }}</p>
                <h1 style="margin:10px 0; font-size:36px; color:#059669;">
                    {{ score }}
                </h1>
                <p style="margin:0; font-size:13px; color:#555;">Your Score</p>
            </div>

            <!-- BUTTON -->
            <div style="text-align:center; margin-top:25px;">
                <a href="#"
                    style="text-decoration:none; padding:12px 24px; background:#10b981; color:white; border-radius:8px; font-weight:bold;">
                    View Details
                </a>
            </div>

        </div>

        <!-- FOOTER -->
        <div style="padding:20px; text-align:center; font-size:12px; color:#888;">
            Keep learning with Learnify 🚀
        </div>

    </div>

</body>

</html>
