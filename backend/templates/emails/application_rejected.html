<!DOCTYPE html>
<html>

<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial;">

    <div style="max-width:600px; margin:40px auto; background:white; border-radius:16px; overflow:hidden;">

        <div style="background:linear-gradient(135deg,#d63031,#ff7675); padding:30px; color:white; text-align:center;">
            <h2>Application Update</h2>
            <p>Your instructor request was not approved</p>
        </div>

        <div style="padding:30px;">
            <p>Hi <b>{{ username }}</b>,</p>

            <p>Thank you for applying to become an instructor.</p>

            <p>Unfortunately, your application was not approved at this time.</p>

            <div style="margin-top:20px; padding:15px; background:#ffecec; border-radius:10px;">
                ❌ Status: <b>Rejected</b>
            </div>

            <p style="margin-top:20px;">
                You can improve your profile and apply again later.
            </p>
        </div>

        <div style="text-align:center; padding:20px; font-size:12px; color:#888;">
            © Learnify Platform
        </div>

    </div>

</body>

</html>
