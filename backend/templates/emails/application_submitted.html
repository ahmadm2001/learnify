<!DOCTYPE html>
<html>

<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial, sans-serif;">

    <div
        style="max-width:600px; margin:40px auto; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1);">

        <!-- HEADER -->
        <div style="background:linear-gradient(135deg,#6C5CE7,#8E7CFF); padding:30px; text-align:center; color:white;">
            <h2 style="margin:0;">🎉 Application Submitted</h2>
            <p style="margin-top:8px; font-size:13px; opacity:0.9;">
                Your instructor request is under review
            </p>
        </div>

        <!-- BODY -->
        <div style="padding:30px; color:#333;">

            <p style="font-size:16px;">Hi <b>{{ username }}</b>,</p>

            <p style="font-size:14px; line-height:1.6;">
                Your teacher application has been submitted successfully.
            </p>

            <p style="font-size:14px; line-height:1.6;">
                Our team will review your application and notify you soon.
            </p>

            <!-- STATUS BOX -->
            <div style="margin-top:25px; padding:15px; background:#e7f5ff; border-radius:10px; color:#055160;">
                ⏳ Status: <b>Pending Review</b>
            </div>

            <!-- BUTTON -->
            <div style="text-align:center; margin-top:30px;">
                <a href="http://localhost:5173"
                    style="display:inline-block; padding:12px 24px; background:#6C5CE7; color:white; border-radius:8px; text-decoration:none;">
                    Go to Dashboard
                </a>
            </div>

        </div>

        <!-- FOOTER -->
        <div style="padding:20px; text-align:center; font-size:12px; color:#888; border-top:1px solid #eee;">
            © Learnify Platform • Learn with confidence 🚀
        </div>

    </div>

</body>

</html>
