<!DOCTYPE html>
<html>

<body style="margin:0; padding:0; background:#f4f6fb; font-family: 'Segoe UI', sans-serif;">

    <div
        style="max-width:600px; margin:40px auto; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,0.08);">

        <!-- HEADER -->
        <div style="background:linear-gradient(135deg,#6366f1,#8b5cf6); padding:30px; text-align:center; color:white;">
            <h2 style="margin:0;">📝 New Quiz Available</h2>
            <p style="margin-top:8px; font-size:13px; opacity:0.9;">
                A new quiz has been added to your course
            </p>
        </div>

        <!-- BODY -->
        <div style="padding:30px; color:#333;">

            <p>Hello <b>{{ username }}</b>,</p>

            <p style="margin-top:10px;">
                A new quiz has been published in your course.
            </p>

            <!-- CARD -->
            <div style="margin-top:20px; padding:20px; border-radius:12px; background:#f8f9ff;">
                <p style="margin:0;"><b>📚 Course:</b> {{ course_title }}</p>
                <p style="margin:10px 0 0;"><b>📝 Quiz:</b> {{ quiz_title }}</p>
            </div>

            <!-- BUTTON -->
            <div style="text-align:center; margin-top:30px;">
                <a href="#"
                    style="text-decoration:none; padding:12px 24px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border-radius:8px; font-weight:bold;">
                    Take Quiz 🚀
                </a>
            </div>

        </div>

        <!-- FOOTER -->
        <div style="padding:20px; text-align:center; font-size:12px; color:#888; border-top:1px solid #eee;">
            © Learnify • Keep Learning 🚀
        </div>

    </div>

</body>

</html>
